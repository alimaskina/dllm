task: sudoku
dataset_path: Ritvik19/sudoku-dataset
output_type: generate_until
training_split: train
test_split: train
process_docs: !function utils.process_docs
doc_to_text: "{{prompt}}"
doc_to_target: "{{answer}}"
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: valid_sudoku
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "Solve this Sudoku:"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 0
metadata:
  version: 1.0
