task: sudoku_8shot
dataset_path: Ritvik19/sudoku-dataset
output_type: generate_until
training_split: train
test_split: train
process_docs: !function utils.process_docs_8shot
description: "Fill the positions where the values are 0 in a 9x9 grid with digits 1-9 so that each column, each row, and each of the nine 3x3 subgrids that compose the grid contains all of the digits from 1 to 9."
doc_to_text: "Input:\n{{input}}\nOutput:\n"
doc_to_target: "{{target}}"
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: valid_sudoku
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "\n\nInput:"
    - "Input:"
    - "</s>"
    - "<|im_end|>"
  do_sample: false
  temperature: 0.0
repeats: 1
